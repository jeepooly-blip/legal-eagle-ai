name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run tests
        run: pytest -q
        env:
          # Use stub LLM key for tests (conftest stubs EuroVoc network calls)
          MINIMAX_API_KEY: "test-key-not-used"
          COURTLISTENER_BASE_URL: "http://127.0.0.1:0"
          EURLEX_BASE_URL: "http://127.0.0.1:0"
          EUROVOC_SPARQL_URL: "http://127.0.0.1:0"
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "test-key-not-used"
